---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  annotations: 
    kubernetes.io/change-cause: "version1.0"
  labels:
    app: plumber
spec:
  minReadySeconds: 1
  replicas: 4
  revisionHistoryLimit: 7
  selector:
    matchLabels:
      app: plumber
  strategy:
    rollingUpdate:
      maxSurge: 10%
      maxUnavailable: 20%
    type: RollingUpdate
  template:
    metadata: 
      labels: 
        app: plumber
    spec:
      containers: 
        - name: web
          image: shaikkhajaibrahim/dmtest:2.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 125Mi
            limits:
              cpu: 300m
              memory: 500Mi

---
apiVersion: v1
kind: Service
metadata:
  name: web-sv
spec:
  selector:
    app: plumber
  ports:
  - port: 80
    targetPort: 80
