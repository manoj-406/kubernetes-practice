---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: users-db
spec:
  minReadySeconds: 0
  replicas: 1
  revisionHistoryLimit: 5
  selector: 
    matchLabels:
      app: usersdb
  strategy:
    rollingUpdate:
      maxSurge: 20%
      maxUnavailable: 20%
  template: 
    metadata:
      labels:
        app: usersdb
    spec:
      containers:
        - name: users-db
          image: postgres:15-alpine
          envFrom: 
            - configMapRef:
                name: users-db-config
                optional: True
          ports:
            - containerPort: 5432
              protocol: TCP

---
apiVersion: v1
kind: Service
metadata: 
  name: usersdb-svc
spec: 
  type: ClusterIP
  ports: 
    - port: 5432
      targetPort: 5432
  selector: 
    app: usersdb
      
